[package]
name = "pi-control-hub"
version = "0.1.0"
edition = "2024"

[dependencies]
eframe = "0.24"
egui = "0.24"
rppal = { version = "0.14", features = ["gpio", "hal", "i2c", "spi", "pwm", "serial"] }
sysinfo = "0.29"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = "0.4"
anyhow = "1.0"
tokio = { version = "1.0", features = ["full"] }
